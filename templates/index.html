<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Exam Predictor</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background-color: #1e1e2f; /* Tünd fon */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        user-select: text; /* İndi mətn seçilə bilir */
    }

    .card {
        background-color: rgba(255, 255, 255, 0.05);
        border-radius: 15px;
        padding: 30px 25px;
        max-width: 450px;
        text-align: center;
        user-select: text;
    }

    h1 {
        font-size: 1.8rem;
        margin-bottom: 15px;
        color: #ffd700; /* Başlıq üçün yumşaq sarı */
    }

    p {
        font-size: 1rem;
        margin-bottom: 25px;
        line-height: 1.4;
        color: #87ceeb; /* Paraqraf üçün açıq mavi */
    }

    .btn-primary {
        background-color: #4a5bdc;
        border: none;
        padding: 10px 25px;
        font-size: 1rem;
        border-radius: 25px;
    }

    .btn-primary:hover {
        background-color: #3a46a1;
    }
</style>
</head>
<body>
<div class="card">
    <h1>🎓 Student Exam Predictor</h1>
    <p>Predict students’ scores based on their study habits.</p>
    <a href="{{ url_for('predict_datapoint') }}" class="btn btn-primary">Go to Prediction Form</a>
</div>
</body>
</html>
